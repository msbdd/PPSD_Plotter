  #   night_start: "22:00"  # Start time (HH:MM format)
  #   night_stop: "06:00"   # End time (HH:MM format)
  # Note: If night_start > night_stop, the range spans midnight
- action: full
  channels:
  - 00.BH1
  - 00.BH2
  - 00.BHZ
  folder: example/IU.GRFO..D
  plot_kwargs:
    cmap: pqlx
